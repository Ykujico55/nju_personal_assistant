[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-career-apply"
version = "0.2.0"
description = "Independent BOSS job collection and application planning extension"
requires-python = ">=3.12,<3.13"
dependencies = ["personal-assistant-extension-sdk==1.0.0", "playwright==1.62.0"]

[project.scripts]
career-apply = "career_apply.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["career_apply*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../extension_sdk/src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "../../extension_sdk/src"]

[tool.setuptools.data-files]
"share/career-apply/browser" = ["browser/boss-dom.js", "browser/boss-action.js"]
