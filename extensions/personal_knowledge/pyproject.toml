[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-personal-knowledge"
version = "0.1.0"
description = "Personal knowledge extension: authorized roots, extraction, FTS + pgvector"
requires-python = ">=3.12,<3.14"
dependencies = ["personal-assistant-extension-sdk==1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["personal_knowledge*"]
