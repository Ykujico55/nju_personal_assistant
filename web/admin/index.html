<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>助手本机管理</title><link rel="stylesheet" href="./styles.css"></head>
<body><header><h1>助手本机管理</h1><p>仅本机入口。扩展是可信代码；venv 只隔离依赖与崩溃。</p></header><main>
<section class="card"><h2>主机控制</h2><pre id="host-status"></pre><button id="freeze">冻结执行</button><button id="resume" class="secondary">明确解除冻结</button><p id="status" role="status"></p></section>
<section class="card"><h2>扩展</h2><button id="refresh" class="secondary">刷新</button><div id="extensions"></div><form id="inspect"><label for="source">扩展材料路径或明确版本的来源</label><input id="source" required><button>静态核对安装材料</button></form><pre id="preview"></pre><label><input id="trust" type="checkbox">我信任该材料，确认它会以本机用户权限执行</label><button id="install" disabled>确认这份精确材料并安装</button></section>
<section class="card"><h2>本机配置</h2><p>密码和令牌使用 assistantctl secret put；这里只登记句柄和非秘密配置。</p><form id="config-form"><label for="extension-id">扩展 ID</label><input id="extension-id" required><button class="secondary">读取 Schema 与当前配置</button></form><pre id="config-schema"></pre><label for="config-json">配置 JSON</label><textarea id="config-json" rows="12"></textarea><button id="save-config">核对并保存配置（需重启扩展）</button></section>
<section class="card"><h2>声明与只读调度</h2><button id="declarations" class="secondary">读取当前声明</button><pre id="declared"></pre><form id="schedule-form"><label>调度 ID<input name="schedule_id" required></label><label>来源 ID<input name="source_id" required></label><label>扩展 ID<input name="extension_id" required></label><label>扩展版本<input name="extension_version" required></label><button>显式绑定只读轮询</button></form><div id="schedules"></div></section>
</main><footer>备份、恢复、升级与Windows自启动使用运行手册中的本机命令；管理入口不能通过Tunnel或Tailscale代理。</footer><script src="./app.js" defer></script></body></html>
